<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Authentication Portal - Echothred</title>
<link rel="stylesheet" href="login.css">
</head>
<body>

<div id="message-box" style="display: none;"></div>

<header id="main-header">
<div id="logo">
<img src="3.png" alt="Echothred Logo">
<span>Echothred</span>
</div>
<nav id="main-nav">
<a href="#">Home</a>
<span class="divider">|</span>
<a href="#">Features</a>
<span class="divider">|</span>
<a href="#">Contact</a>
</nav>
</header>

<main class="container">

<div class="box">
<div class="logo-name">Log In</div>

<input type="email" id="login-email" placeholder="Email Address" required>
<input type="password" id="login-password" placeholder="Password" required>

<button id="login-btn" class="btn">Log In</button>

<p class="small-text">
    Don't have an account? 
    <a href="#" id="show-signup-link">Sign Up</a>
</p>


</div>

<div class="box" id="signup-box" style="display: none;">
<div class="logo-name">Create Account</div>

<input type="email" id="signup-email" placeholder="Email Address" required>
<input type="password" id="signup-password" placeholder="Password (min 6 characters)" required>
<input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>

<button id="signup-btn" class="btn">Sign Up</button>

<p class="small-text">
    Already have an account? 
    <a href="#" id="show-login-link">Log In</a>
</p>


</div>

</main>

<footer>
&copy; 2024 Echothred ICT Project | Powered by Firebase
</footer>
<script src="login.js"></script>
</body>
</html>
